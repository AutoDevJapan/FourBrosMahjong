name: gitleaks

# Secret scanning with gitleaks.
# Runs on pull requests and pushes to main, plus manual dispatch.
# Fails the check when secrets are detected.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest scan for a given event/ref. Including the event prevents
# an opt-in workflow_dispatch on main from cancelling the required push scan.
concurrency:
  group: gitleaks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Minimize permissions so fork PRs work without extra grants.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # 異常時に既定の6時間まで runner を占有させない (#491)。実測は常に 10 秒前後。
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the entire commit log is scanned.
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE secret for
      # GitHub organization repositories, so it fails with "missing gitleaks
      # license" on this org-owned repo (see gitleaks/gitleaks-action#211).
      # Install and run the open-source gitleaks CLI directly instead, pinned to
      # the same version and review-approved archive digest stored in this file.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksum_file="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          download_via_api() {
            local name="$1" limit="$2" api_url
            api_url="$(gh api "repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" --jq ".assets[] | select(.name == \"${name}\") | .url")"
            if [[ ! "$api_url" =~ ^https://api\.github\.com/repos/gitleaks/gitleaks/releases/assets/[0-9]+$ ]]; then
              echo "release metadata must identify one canonical upstream asset" >&2
              return 1
            fi
            curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --retry-max-time 120 --connect-timeout 10 --max-time 60 --max-filesize "$limit" --header 'Accept: application/octet-stream' --header "Authorization: Bearer $GH_TOKEN" --output "$name" "$api_url"
          }
          # The release is authenticated below, but an upstream/network fault
          # must not make a secret-scan runner download forever or fill its disk.
          # Keep the checksum manifest much smaller than the binary archive.
          curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --retry-max-time 120 --connect-timeout 10 --max-time 60 --max-filesize 1048576 --output "${checksum_file}" "${base_url}/${checksum_file}" || download_via_api "$checksum_file" 1048576
          curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --retry-max-time 120 --connect-timeout 10 --max-time 60 --max-filesize 134217728 --output "${archive}" "${base_url}/${archive}" || download_via_api "$archive" 134217728

          # Do not let a checksum manifest silently omit the archive we are about to
          # install. A missing-file-tolerant checksum check would return success in
          # that case and leave the downloaded executable unverified.
          remote_hash="$(
            awk -v archive="${archive}" '
              {
                name = $2
                sub(/^\*/, "", name)
                sub(/\r$/, "", name)
                if (name == archive) {
                  print $1
                  matches++
                }
              }
              END {
                if (matches != 1) exit 1
              }
            ' "${checksum_file}"
          )" || {
            echo "checksum manifest must contain exactly one entry for ${archive}" >&2
            exit 1
          }
          if [[ ! "${remote_hash}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "checksum manifest contains an invalid SHA-256 for ${archive}" >&2
            exit 1
          fi
          if [[ ! "${GITLEAKS_ARCHIVE_SHA256}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "repository-pinned SHA-256 for ${archive} is invalid" >&2
            exit 1
          fi

          # The repository pin is the only value that authenticates the bytes
          # before extraction. The remote manifest is auxiliary consistency
          # evidence and can only make this step fail closed.
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict -
          if [[ "${remote_hash,,}" != "${GITLEAKS_ARCHIVE_SHA256,,}" ]]; then
            echo "upstream checksum differs from the repository-pinned SHA-256" >&2
            exit 1
          fi
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose
