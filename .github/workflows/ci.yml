name: CI

# docs/デプロイ環境運用.md の昇格フロー (feature → dev → stg → main) の全段をガードするため、
# 3 つの永続ブランチ (main / dev / stg) を宛先とする PR とそれらへの push で CI を実行する。
# dev / stg に活動がない間はトリガが発火しないため、Actions 実行時間 (課金) は増えない。
on:
  pull_request:
    branches: [main, dev, stg]
  push:
    branches: [main, dev, stg]

# 同一ブランチで新しい push があれば古い実行をキャンセルして無駄を省く
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小権限の原則: このワークフローはチェックアウトして読むだけなので read-only で十分
permissions:
  contents: read

# キャッシュ方針 (#380)
# GitHub Actions のキャッシュ予算はリポジトリあたり 10GB で、超過分は LRU で退避される。
# キャッシュは ref スコープで、PR (`refs/pull/N/merge`) 用に保存したエントリは他の PR から
# 参照できないため、全 job が無条件に save すると同一内容が ref の数だけ複製され、
# 数日で予算が一巡して「保存はするが復元前に消える」恒常ミス状態になる。
#
# したがって本ワークフローでは **保存は既定ブランチ (main) の push 実行のみ** に限定し、
# PR / dev / stg は復元専用とする。既定ブランチのキャッシュは全ブランチ・全 PR から
# 復元できるため、ヒット率を落とさずに複製だけを止められる。
# この不変条件は `src/test/ci-workflow.test.ts` が回帰テストとして固定している。

jobs:
  ci:
    name: lint / typecheck / format / test / build
    runs-on: ubuntu-latest
    # 個別ツールが終了しない回帰でも、既定の6時間まで品質ゲートを占有させない。
    # 通常実行時間には十分な余裕を持たせつつ、異常時は30分で失敗として返す。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc がリポジトリの Node バージョンの単一の情報源。
          # dependency-cruiser@18 の engines.node が Node 22+ を要求し、
          # .npmrc の engine-strict=true により Node 20 では install が失敗するため 22 LTS を .nvmrc に固定している。
          node-version-file: ".nvmrc"
          # `cache: pnpm` は使わない。setup-node の内蔵キャッシュは ref スコープで無条件に save するため、
          # PR ref ごとに同一内容の pnpm store (約 165MB) が複製され 10GB 予算を食い潰す (#380)。
          # 代わりに下の restore / save を使い、save を main に限定する。

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # main で保存したキャッシュは既定ブランチ由来のため PR / dev / stg からも復元できる。
      # PR 側は復元専用にして、ref ごとの複製を作らない (#380)。
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm store のキーは e2e job と共通のため、保存は ci job のみが行う。
      # 両 job から同一キーで save すると後発が "Cache already exists" 警告になるだけで無駄。
      - name: Save pnpm store
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint (eslint)
        run: pnpm lint

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      # `biome check` は `biome format` の上位互換(整形 + assist。linter は
      # biome.json で無効)。`format:check` だけをゲートにしていた間に assist
      # (organizeImports) の違反が 38 件たまり、`pnpm check` が main で一度も
      # 緑にならない状態になっていた (#418)。ステップは増やさず check へ寄せる。
      - name: Format & assist check (biome)
        run: pnpm check

      - name: Test (vitest)
        run: pnpm test

      - name: Knip
        run: pnpm knip

      - name: Dependency Cruiser
        run: pnpm depcruise

      - name: Build (next build)
        env:
          # 実配布buildでは未設定のE2E専用フラグ。production成果物でも決定的seedを使い、
          # dev/prodの主要導線を同じ局面で比較する(#432)。
          NEXT_PUBLIC_E2E_SEED_ENABLED: "1"
        run: pnpm build

      # Service Worker は production build でのみ登録されるため、通常の dev E2E job では
      # pwa-offline.spec.ts の全件が意図的に skip される。既にこのjobで作った `.next` を
      # そのまま `next start` し、依存install/buildを重複させずPWAと主要導線のprod parityを固定する。

      # キャッシュキーにはインストールするブラウザ集合を必ず含める。両 job が同じ path を
      # 同じキーで共有すると、先に保存した側(chromium のみ)の内容がキーを占有し、
      # webkit を要求する e2e job は毎回ダウンロードし直しになる(exact hit のため保存も走らない)。
      - name: Restore Playwright browser for production PWA E2E
        id: pwa-playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser for production PWA E2E
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: pnpm exec playwright install --with-deps chromium

      - name: Save Playwright browser for production PWA E2E
        if: github.ref == 'refs/heads/main' && steps.pwa-playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Production E2E (PWA / persistence / modal focus)
        env:
          E2E_PORT: "3101"
        run: pnpm test:e2e:prod:prebuilt

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # 既存の ci ジョブ (lint/typecheck/format/test/build) とは独立に並列実行する。
    # playwright.config.ts の webServer は `pnpm dev` を自前で起動するためビルド成果物に依存せず、
    # ci ジョブの完了を待つ必要がない。
    # ハングした場合にジョブを長時間占有し続けないようタイムアウトを明示する。
    # webkit 追加(#369)で --with-deps の apt install(gstreamer 系等)とバイナリ取得が増えた分、
    # 15分から引き上げている。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc がリポジトリの Node バージョンの単一の情報源。
          node-version-file: ".nvmrc"
          # `cache: pnpm` を使わない理由と代替は ci job 側のコメントを参照 (#380)。
          # pnpm store の保存は ci job のみが行い、この job は復元専用。

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ブラウザバイナリ (~/.cache/ms-playwright) を pnpm-lock.yaml のハッシュ (= @playwright/test の
      # バージョン変化を含む) とインストールするブラウザ集合をキーにキャッシュし、CI 実行時間を短縮する。
      # ブラウザ集合をキーに含めないと、chromium のみを入れる ci job とキーが衝突して webkit が
      # 常にキャッシュから漏れる。OS 依存パッケージの apt install はキャッシュの有無に関わらず
      # --with-deps で毎回実行するため、キャッシュヒット時もブラウザ本体の再ダウンロードのみがスキップされる。
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-chromium-webkit-${{ hashFiles('pnpm-lock.yaml') }}

      # Ubuntu ランナーで --with-deps が apt-get 経由で依存パッケージを更新する際、needrestart が
      # 対話的な再起動確認プロンプトを出して非対話環境でハングすることがあるため、
      # 環境変数で明示的に自動応答させる。
      - name: Install Playwright browsers (chromium / webkit + OS deps)
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Save Playwright browsers
        if: github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-chromium-webkit-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Test (playwright e2e)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
