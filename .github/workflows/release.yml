# Release ワークフロー
#
# バージョニング方針: SemVer (Semantic Versioning)。
#   Git タグ = リリースバージョン。`vMAJOR.MINOR.PATCH` 形式のタグ (例: v0.1.0) を
#   push することがリリースの起点になります。
#
# 動作: 新規作成された `v*` タグの push を契機に GitHub Release を自動作成します。
#   - 外部シークレット不要 (組み込みの GITHUB_TOKEN のみを使用)。
#   - 公開前 guard が SemVer・package/CHANGELOG・main ancestry と、同じ SHA の
#     trusted CI・gitleaks・CodeQL を照合し、
#     いずれかの証拠を確認できない場合は fail closed で停止します。
#
# リリース手順の詳細は CHANGELOG.md の「リリース運用方針」を参照してください。

name: Release

on:
  push:
    tags:
      - "v*"

# 同じタグへの再 push (タグ付け直し) は guard が fail closed で拒否する。
# タグ単位の直列化も維持し、許可された同一イベントの再実行だけを順序づける。
# `cancel-in-progress` は **false**。Release 作成は途中で中断すると「タグはあるが Release が無い」
# 中途半端な状態を残すため、CI と違って進行中の実行は必ず完走させる (#491)。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 既定は検証用の read のみ。公開 job だけが contents: write へ昇格する。
permissions:
  contents: read
  actions: read
  checks: read

jobs:
  validate:
    name: Validate release evidence
    runs-on: ubuntu-latest
    # 異常時に既定の6時間まで runner を占有させない (#491)。
    # 実処理は checkout・tag ancestry・Actions API 照合で通常 1 分未満。
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard release evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG_CREATED: ${{ github.event.created }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-guard.mjs

      - name: Extract validated release notes
        shell: bash
        run: |
          install -d -m 0700 "${RUNNER_TEMP}/release-artifact"
          version="${GITHUB_REF_NAME#v}"
          node .github/scripts/release-guard.mjs --extract-notes "${version}" > "${RUNNER_TEMP}/release-artifact/release-notes.md"

      - name: Upload validated release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release-notes
          path: ${{ runner.temp }}/release-artifact/release-notes.md
          if-no-files-found: error
          overwrite: false
          retention-days: 1
          include-hidden-files: false

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write authority exists only after the read-only validation job succeeds.
    permissions:
      contents: write
    steps:
      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-notes
          path: ${{ runner.temp }}/release-artifact
          digest-mismatch: error

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # guard が対応する非空節を必須化しているため、自動生成へのfallbackはしない。
          body_path: ${{ runner.temp }}/release-artifact/release-notes.md
          # プレリリース識別子 (例: v1.0.0-rc.1) を含むタグは prerelease として扱う。
          prerelease: ${{ contains(github.ref_name, '-') }}
