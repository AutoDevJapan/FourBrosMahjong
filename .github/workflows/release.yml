# Release ワークフロー
#
# バージョニング方針: SemVer (Semantic Versioning)。
#   Git タグ = リリースバージョン。`vMAJOR.MINOR.PATCH` 形式のタグ (例: v0.1.0) を
#   push することがリリースの起点になります。
#
# 動作: `v*` タグの push を契機に GitHub Release を自動作成します。
#   - 外部シークレット不要 (組み込みの GITHUB_TOKEN のみを使用)。
#   - 公開前 guard が SemVer・package/CHANGELOG・main ancestry・trusted CI を照合し、
#     どの証拠も確認できない場合は fail closed で停止します。
#
# リリース手順の詳細は CHANGELOG.md の「リリース運用方針」を参照してください。

name: Release

on:
  push:
    tags:
      - "v*"

# 同じタグへの再 push (タグ付け直し) で二重に Release を作らないよう、タグ単位で直列化する。
# `cancel-in-progress` は **false**。Release 作成は途中で中断すると「タグはあるが Release が無い」
# 中途半端な状態を残すため、CI と違って進行中の実行は必ず完走させる (#491)。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 既定は検証用の read のみ。公開 job だけが contents: write へ昇格する。
permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate release evidence
    runs-on: ubuntu-latest
    # 異常時に既定の6時間まで runner を占有させない (#491)。
    # 実処理は checkout と Release 作成 API のみで通常 1 分未満。
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Guard release evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-guard.mjs

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write authority exists only after the read-only validation job succeeds.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog section for this tag
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          # CHANGELOG.md から `## [<version>]` の節だけを抽出する。
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$version" '
              index($0, "## [" ver "] - ") == 1 { capture = 1; next }
              capture && (/^## \[/ || /^\[.+\]:/) { exit }
              capture { print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [ -s "$notes_file" ]; then
            echo "notes_path=$notes_file" >> "$GITHUB_OUTPUT"
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          # guard が対応する非空節を必須化しているため、自動生成へのfallbackはしない。
          body_path: ${{ steps.changelog.outputs.notes_path }}
          # プレリリース識別子 (例: v1.0.0-rc.1) を含むタグは prerelease として扱う。
          prerelease: ${{ contains(github.ref_name, '-') }}
